<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Correo Electrónico - Ensanbliss</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
        overflow: hidden;
    }

    body {
        font-family: 'Cormorant Garamond', serif;
        background: #1a1410;
    }

    /* Pantalla de carga */
    .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
    }

    .background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('https://raw.githubusercontent.com/SANFRAMAX10/Ensanbliss/refs/heads/main/ensanblis.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: -2;
    }

    .background::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, rgba(26, 20, 16, 0.85), rgba(61, 42, 28, 0.75));
        z-index: 1;
    }

    /* Estrellitas flotantes */
    .stars {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
        overflow: hidden;
    }

    .star {
        position: absolute;
        background: #d4af37;
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        animation: twinkle 2s infinite ease-in-out;
    }

    @keyframes twinkle {
        0%, 100% {
            opacity: 0.3;
            transform: scale(1);
        }
        50% {
            opacity: 1;
            transform: scale(1.2);
        }
    }

    /* Contenedor de carga */
    .loading-container {
        text-align: center;
        background: linear-gradient(135deg, rgba(61, 42, 28, 0.9), rgba(26, 20, 16, 0.95));
        backdrop-filter: blur(20px);
        border: 3px solid rgba(212, 175, 55, 0.5);
        border-radius: 30px;
        padding: 60px 80px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6),
                    0 0 40px rgba(212, 175, 55, 0.3);
        position: relative;
        overflow: hidden;
        animation: fadeIn 0.8s ease;
    }

    .loading-container::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(45deg, transparent, rgba(212, 175, 55, 0.1), transparent);
        animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
        0% {
            transform: translateX(-100%) translateY(-100%);
        }
        100% {
            transform: translateX(100%) translateY(100%);
        }
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: scale(0.9);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    .logo-container {
        margin-bottom: 30px;
        position: relative;
        z-index: 1;
    }

    .logo {
        width: 150px;
        height: 150px;
        object-fit: contain;
        filter: drop-shadow(0 0 30px rgba(212, 175, 55, 0.6));
        animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
        0%, 100% {
            transform: scale(1);
            filter: drop-shadow(0 0 30px rgba(212, 175, 55, 0.6));
        }
        50% {
            transform: scale(1.05);
            filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.8));
        }
    }

    .loading-title {
        font-family: 'Allura', cursive;
        font-size: 3.5em;
        color: #d4af37;
        text-shadow: 0 0 30px rgba(212, 175, 55, 0.6),
                     0 0 50px rgba(212, 175, 55, 0.4);
        margin-bottom: 20px;
        position: relative;
        z-index: 1;
    }

    .loading-message {
        font-size: 1.8em;
        color: #f4e4c1;
        margin-bottom: 30px;
        position: relative;
        z-index: 1;
    }

    .loading-subtitle {
        font-size: 1.4em;
        color: #d4af37;
        margin-bottom: 30px;
        position: relative;
        z-index: 1;
        font-weight: 600;
    }

    /* Spinner de carga */
    .spinner {
        margin: 0 auto;
        width: 60px;
        height: 60px;
        position: relative;
        z-index: 1;
    }

    .spinner::before {
        content: '';
        box-sizing: border-box;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 4px solid rgba(212, 175, 55, 0.2);
        border-top-color: #d4af37;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    /* iframe contenedor */
    #website-frame {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        opacity: 0;
        transition: opacity 0.5s ease;
    }

    #website-frame.visible {
        opacity: 1;
    }

    /* Botón flotante para volver */
    .back-button {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 12px 25px;
        background: rgba(26, 20, 16, 0.9);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(212, 175, 55, 0.6);
        border-radius: 12px;
        color: #d4af37;
        font-size: 1.1em;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        z-index: 9999;
        font-family: 'Cormorant Garamond', serif;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease, opacity 0.5s ease 0.5s, visibility 0.5s ease 0.5s;
    }

    .back-button.visible {
        opacity: 1;
        visibility: visible;
    }

    .back-button:hover {
        background: rgba(212, 175, 55, 0.3);
        box-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
        transform: translateX(-5px);
    }
  </style>
</head>
<body>
<!-- Pantalla de Carga -->
<div class="loading-screen" id="loadingScreen">
  <!-- Fondo -->
  <div class="background"></div>

  <!-- Estrellitas -->
  <div class="stars" id="stars"></div>

  <!-- Contenedor de Carga -->
  <div class="loading-container">
    <div class="logo-container">
      <img src="https://raw.githubusercontent.com/SANFRAMAX10/Ensanbliss/refs/heads/main/mails.png" alt="Email Logo" class="logo">
    </div>

    <h1 class="loading-title">Correo Electrónico</h1>

    <p class="loading-subtitle">info@ensanbliss.es</p>

    <p class="loading-message">Cargando tu bandeja de entrada...</p>

    <div class="spinner"></div>
  </div>
</div>

<!-- Botón Volver (flotante) -->
<a href="index.html" class="back-button" id="backButton">← Volver</a>

<!-- iframe con el webmail -->
<iframe id="website-frame" src="https://mail.hostinger.com/v2/?_user=info@ensanbliss.es" allowfullscreen></iframe>

<script>
  // Generar estrellitas aleatorias
  function createStars() {
      const starsContainer = document.getElementById('stars');
      const numberOfStars = 40;

      for (let i = 0; i < numberOfStars; i++) {
          const star = document.createElement('div');
          star.className = 'star';

          // Tamaño aleatorio
          const size = Math.random() * 8 + 4;
          star.style.width = size + 'px';
          star.style.height = size + 'px';

          // Posición aleatoria
          star.style.left = Math.random() * 100 + '%';
          star.style.top = Math.random() * 100 + '%';

          // Delay aleatorio
          star.style.animationDelay = `${Math.random() * 3}s`;

          // Opacidad aleatoria
          star.style.opacity = Math.random() * 0.5 + 0.3;

          starsContainer.appendChild(star);
      }
  }

  createStars();

  // Ocultar pantalla de carga y mostrar iframe después de 2.5 segundos
  setTimeout(function() {
      const loadingScreen = document.getElementById('loadingScreen');
      const iframe = document.getElementById('website-frame');
      const backButton = document.getElementById('backButton');

      // Ocultar pantalla de carga
      loadingScreen.classList.add('hidden');

      // Mostrar iframe
      iframe.classList.add('visible');

      // Mostrar botón volver
      backButton.classList.add('visible');
  }, 2500);
</script>


<!-- Ensanbliss Modal Alerts (Velociraptor style) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">

<style>
  :root{
    --ens-bg: rgba(10, 8, 7, 0.72);
    --ens-card: rgba(18, 14, 12, 0.92);
    --ens-stroke: rgba(255,255,255,0.14);
    --ens-text: rgba(255,255,255,0.92);
    --ens-muted: rgba(255,255,255,0.70);
    --ens-gold: rgba(210, 170, 110, 0.95);
    --ens-shadow: 0 18px 55px rgba(0,0,0,0.55);
  }

  .ens-alert-overlay{
    position: fixed;
    inset: 0;
    background: var(--ens-bg);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    z-index: 999999;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .ens-alert-overlay.show{ display: flex; }

  .ens-alert-card{
    width: min(560px, 92vw);
    border: 1px solid var(--ens-stroke);
    background: var(--ens-card);
    border-radius: 18px;
    box-shadow: var(--ens-shadow);
    overflow: hidden;
  }

  .ens-alert-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.10);
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0));
  }

  .ens-alert-brand{
    font-family: "Allura", cursive;
    font-size: 34px;
    line-height: 1;
    color: var(--ens-gold);
    letter-spacing: 0.2px;
    user-select: none;
  }

  .ens-alert-closex{
    appearance: none;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: var(--ens-text);
    border-radius: 10px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 14px;
  }
  .ens-alert-closex:hover{ background: rgba(255,255,255,0.10); }

  .ens-alert-body{
    padding: 14px 16px 6px;
    color: var(--ens-text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    white-space: pre-wrap;
  }

  .ens-alert-footer{
    padding: 12px 16px 16px;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .ens-btn{
    appearance: none;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.08);
    color: var(--ens-text);
    padding: 10px 14px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
  }
  .ens-btn:hover{ background: rgba(255,255,255,0.12); }

  .ens-btn-primary{
    border-color: rgba(210, 170, 110, 0.55);
    background: rgba(210, 170, 110, 0.16);
  }
  .ens-btn-primary:hover{ background: rgba(210, 170, 110, 0.22); }

  .ens-alert-sub{
    padding: 0 16px 6px;
    color: var(--ens-muted);
    font-size: 12.5px;
  }
</style>

<div id="ensAlert" class="ens-alert-overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="ens-alert-card">
    <div class="ens-alert-header">
      <div class="ens-alert-brand">Ensanbliss</div>
      <button class="ens-alert-closex" type="button" data-ens-close aria-label="Cerrar">Cerrar</button>
    </div>

    <div id="ensAlertMsg" class="ens-alert-body"></div>
    <div id="ensAlertSub" class="ens-alert-sub" style="display:none;"></div>

    <div id="ensAlertActions" class="ens-alert-footer"></div>
  </div>
</div>

<script>
(function(){
  const overlay = document.getElementById('ensAlert');
  const msgEl = document.getElementById('ensAlertMsg');
  const subEl = document.getElementById('ensAlertSub');
  const actionsEl = document.getElementById('ensAlertActions');

  let lastActive = null;

  function openModal({ message, subtext, buttons }) {
    lastActive = document.activeElement;

    msgEl.textContent = (message ?? '').toString();

    if (subtext) {
      subEl.style.display = 'block';
      subEl.textContent = subtext.toString();
    } else {
      subEl.style.display = 'none';
      subEl.textContent = '';
    }

    actionsEl.innerHTML = '';
    buttons.forEach(btn => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'ens-btn' + (btn.primary ? ' ens-btn-primary' : '');
      b.textContent = btn.label;
      b.addEventListener('click', () => {
        closeModal();
        try { btn.onClick && btn.onClick(); } catch(e){}
      });
      actionsEl.appendChild(b);
    });

    overlay.classList.add('show');
    overlay.setAttribute('aria-hidden', 'false');

    const firstBtn = actionsEl.querySelector('button');
    if (firstBtn) firstBtn.focus();
  }

  function closeModal(){
    overlay.classList.remove('show');
    overlay.setAttribute('aria-hidden', 'true');
    actionsEl.innerHTML = '';

    if (lastActive && typeof lastActive.focus === 'function') {
      try { lastActive.focus(); } catch(e){}
    }
  }

  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal();
  });

  overlay.querySelectorAll('[data-ens-close]').forEach(el => {
    el.addEventListener('click', closeModal);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('show')) closeModal();
  });

  window.alert = function(message){
    openModal({
      message,
      subtext: '',
      buttons: [{ label: 'Cerrar', primary: true, onClick: () => {} }]
    });
  };

  window.ensConfirm = function(message){
    return new Promise((resolve) => {
      openModal({
        message,
        subtext: '¿Deseas continuar?',
        buttons: [
          { label: 'Cancelar', primary: false, onClick: () => resolve(false) },
          { label: 'Confirmar', primary: true, onClick: () => resolve(true) }
        ]
      });
    });
  };

  window.confirm = function(message){
    openModal({
      message,
      subtext: 'Confirmación requerida',
      buttons: [{ label: 'Cerrar', primary: true, onClick: () => {} }]
    });
    return false;
  };
})();
</script>

</body>
</html>
