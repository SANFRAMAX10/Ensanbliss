<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ensanbliss</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Cormorant Garamond', serif;
            min-width: 1024px;
            overflow: hidden;
            background: #1a1410;
            color: #f4e4c1;
            height: 100vh;
        }

        .background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('https://raw.githubusercontent.com/SANFRAMAX10/Ensanbliss/refs/heads/main/ensanblis.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        .background::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(26, 20, 16, 0.7), rgba(61, 42, 28, 0.6));
            z-index: 1;
        }

        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: #d4af37;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.3), transparent);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }

        .particle:nth-child(1) { width: 60px; height: 60px; top: 20%; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 50px; height: 50px; top: 60%; left: 80%; animation-delay: 3s; }
        .particle:nth-child(3) { width: 70px; height: 70px; top: 40%; left: 50%; animation-delay: 6s; }
        .particle:nth-child(4) { width: 55px; height: 55px; top: 70%; left: 20%; animation-delay: 9s; }
        .particle:nth-child(5) { width: 65px; height: 65px; top: 15%; left: 70%; animation-delay: 12s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0) scale(1); opacity: 0.3; }
            25% { transform: translateY(-30px) translateX(20px) scale(1.1); opacity: 0.5; }
            50% { transform: translateY(-50px) translateX(-15px) scale(0.9); opacity: 0.4; }
            75% { transform: translateY(-20px) translateX(25px) scale(1.05); opacity: 0.6; }
        }

        .top-banner {
            background: linear-gradient(90deg, rgba(61, 42, 28, 0.9), rgba(139, 99, 60, 0.8), rgba(61, 42, 28, 0.9));
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(212, 175, 55, 0.5);
            padding: 12px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .top-banner h1 {
            font-family: 'Allura', cursive;
            font-size: 2.8em;
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5),
                         0 0 40px rgba(212, 175, 55, 0.3);
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
            margin: 0;
        }

        .clock-container {
            position: absolute;
            top: 15px;
            right: 25px;
            background: rgba(26, 20, 16, 0.8);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 12px;
            border: 2px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .clock {
            font-size: 1.2em;
            font-weight: 600;
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            letter-spacing: 2px;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 30px;
            height: calc(100vh - 90px);
            display: flex;
            align-items: center;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
        }

        .card {
            background: linear-gradient(135deg, rgba(61, 42, 28, 0.85), rgba(26, 20, 16, 0.9));
            backdrop-filter: blur(15px);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            color: inherit;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, transparent, rgba(212, 175, 55, 0.1));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card:hover::before { opacity: 1; }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(212, 175, 55, 0.7);
            box-shadow: 0 15px 50px rgba(212, 175, 55, 0.3),
                        0 0 30px rgba(212, 175, 55, 0.2);
        }

        .card-bg-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.08;
            transition: all 0.4s ease;
            filter: blur(1px);
        }

        .card:hover .card-bg-image {
            opacity: 0.12;
            transform: translate(-50%, -50%) scale(1.05);
        }

        .card-logo {
            width: 170px;
            height: 170px;
            object-fit: contain;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4));
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .card-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #f4e4c1;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
            line-height: 1.3;
        }

        .card-subtitle {
            font-size: 1em;
            color: rgba(244, 228, 193, 0.8);
            position: relative;
            z-index: 1;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card { animation: fadeInUp 0.6s ease forwards; opacity: 0; }
        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }
        .card:nth-child(5) { animation-delay: 0.5s; }
        .card:nth-child(6) { animation-delay: 0.6s; }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="particles">

            <img src="https://raw.githubusercontent.com/SANFRAMAX10/Ensanbliss/refs/heads/main/mails.png" class="card-logo" alt="Email">

            <img src="https://raw.githubusercontent.com/SANFRAMAX10/Ensanbliss/refs/heads/main/13.%20CESAR%20SANTOS.png" class="card-logo" alt="Instagram">

<script>
    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clock').textContent = `${h}:${m}:${s}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    function createStars() {
        const starsContainer = document.getElementById('stars');
        const numberOfStars = 25;

        for (let i = 0; i < numberOfStars; i++) {
            const star = document.createElement('div');
            star.className = 'star';

            const size = Math.random() * 6 + 3;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = `${Math.random() * 3}s`;
            star.style.opacity = Math.random() * 0.5 + 0.3;

            starsContainer.appendChild(star);
        }
    }
    createStars();

    // Abre en tabs (Android) o fallback a html local (PC)
    function openSection(n){
        try{
            if(window.Android){
                if(n===1 && typeof Android.openSection1==="function"){ Android.openSection1(); return false; }
                if(n===2 && typeof Android.openSection2==="function"){ Android.openSection2(); return false; }
                if(n===3 && typeof Android.openSection3==="function"){ Android.openSection3(); return false; }
                if(n===4 && typeof Android.openSection4==="function"){ Android.openSection4(); return false; }
                if(n===5 && typeof Android.openSection5==="function"){ Android.openSection5(); return false; }
                if(n===6 && typeof Android.openSection6==="function"){ Android.openSection6(); return false; }
            }
        }catch(e){}

        window.location.href = "seccion"+n+".html";
        return false;
    }
</script>



<!-- Ensanbliss Modal Alerts (Velociraptor style) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">

<style>
  :root{
    --ens-bg: rgba(10, 8, 7, 0.72);
    --ens-card: rgba(18, 14, 12, 0.92);
    --ens-stroke: rgba(255,255,255,0.14);
    --ens-text: rgba(255,255,255,0.92);
    --ens-muted: rgba(255,255,255,0.70);
    --ens-gold: rgba(210, 170, 110, 0.95);
    --ens-shadow: 0 18px 55px rgba(0,0,0,0.55);
  }

  .ens-alert-overlay{
    position: fixed;
    inset: 0;
    background: var(--ens-bg);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    z-index: 999999;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .ens-alert-overlay.show{ display: flex; }

  .ens-alert-card{
    width: min(560px, 92vw);
    border: 1px solid var(--ens-stroke);
    background: var(--ens-card);
    border-radius: 18px;
    box-shadow: var(--ens-shadow);
    overflow: hidden;
  }

  .ens-alert-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.10);
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0));
  }

  .ens-alert-brand{
    font-family: "Allura", cursive;
    font-size: 34px;
    line-height: 1;
    color: var(--ens-gold);
    letter-spacing: 0.2px;
    user-select: none;
  }

  .ens-alert-closex{
    appearance: none;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: var(--ens-text);
    border-radius: 10px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 14px;
  }
  .ens-alert-closex:hover{ background: rgba(255,255,255,0.10); }

  .ens-alert-body{
    padding: 14px 16px 6px;
    color: var(--ens-text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    white-space: pre-wrap;
  }

  .ens-alert-footer{
    padding: 12px 16px 16px;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .ens-btn{
    appearance: none;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.08);
    color: var(--ens-text);
    padding: 10px 14px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
  }
  .ens-btn:hover{ background: rgba(255,255,255,0.12); }

  .ens-btn-primary{
    border-color: rgba(210, 170, 110, 0.55);
    background: rgba(210, 170, 110, 0.16);
  }
  .ens-btn-primary:hover{ background: rgba(210, 170, 110, 0.22); }

  .ens-alert-sub{
    padding: 0 16px 6px;
    color: var(--ens-muted);
    font-size: 12.5px;
  }
</style>

<div id="ensAlert" class="ens-alert-overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="ens-alert-card">
    <div class="ens-alert-header">
      <div class="ens-alert-brand">Ensanbliss</div>
      <button class="ens-alert-closex" type="button" data-ens-close aria-label="Cerrar">Cerrar</button>
    </div>

    <div id="ensAlertMsg" class="ens-alert-body"></div>
    <div id="ensAlertSub" class="ens-alert-sub" style="display:none;"></div>

    <div id="ensAlertActions" class="ens-alert-footer"></div>
  </div>
</div>

<script>
(function(){
  const overlay = document.getElementById('ensAlert');
  const msgEl = document.getElementById('ensAlertMsg');
  const subEl = document.getElementById('ensAlertSub');
  const actionsEl = document.getElementById('ensAlertActions');

  let lastActive = null;

  function openModal({ message, subtext, buttons }) {
    lastActive = document.activeElement;

    msgEl.textContent = (message ?? '').toString();

    if (subtext) {
      subEl.style.display = 'block';
      subEl.textContent = subtext.toString();
    } else {
      subEl.style.display = 'none';
      subEl.textContent = '';
    }

    actionsEl.innerHTML = '';
    buttons.forEach(btn => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'ens-btn' + (btn.primary ? ' ens-btn-primary' : '');
      b.textContent = btn.label;
      b.addEventListener('click', () => {
        closeModal();
        try { btn.onClick && btn.onClick(); } catch(e){}
      });
      actionsEl.appendChild(b);
    });

    overlay.classList.add('show');
    overlay.setAttribute('aria-hidden', 'false');

    const firstBtn = actionsEl.querySelector('button');
    if (firstBtn) firstBtn.focus();
  }

  function closeModal(){
    overlay.classList.remove('show');
    overlay.setAttribute('aria-hidden', 'true');
    actionsEl.innerHTML = '';

    if (lastActive && typeof lastActive.focus === 'function') {
      try { lastActive.focus(); } catch(e){}
    }
  }

  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal();
  });

  overlay.querySelectorAll('[data-ens-close]').forEach(el => {
    el.addEventListener('click', closeModal);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('show')) closeModal();
  });

  window.alert = function(message){
    openModal({
      message,
      subtext: '',
      buttons: [{ label: 'Cerrar', primary: true, onClick: () => {} }]
    });
  };

  window.ensConfirm = function(message){
    return new Promise((resolve) => {
      openModal({
        message,
        subtext: '¿Deseas continuar?',
        buttons: [
          { label: 'Cancelar', primary: false, onClick: () => resolve(false) },
          { label: 'Confirmar', primary: true, onClick: () => resolve(true) }
        ]
      });
    });
  };

  window.confirm = function(message){
    openModal({
      message,
      subtext: 'Confirmación requerida',
      buttons: [{ label: 'Cerrar', primary: true, onClick: () => {} }]
    });
    return false;
  };
})();
</script>


<script id="ensSafeClockPatch">
(function(){
  const oldSetInterval = window.setInterval;
  // Patch only prevents future direct errors from missing clock elements by creating hidden placeholders.
  ['clock','currentTime','timeNow'].forEach(id=>{ if(!document.getElementById(id)){ const s=document.createElement('span'); s.id=id; s.style.display='none'; document.body.appendChild(s); } });
})();
</script>
