<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram - Ensanbliss</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Cormorant Garamond', serif;
        min-width: 1024px;
        overflow: hidden;
        background: #1a1410;
        color: #f4e4c1;
        height: 100vh;
    }

    .background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('https://raw.githubusercontent.com/SANFRAMAX10/Ensanbliss/refs/heads/main/ensanblis.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: -2;
    }

    .background::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, rgba(26, 20, 16, 0.85), rgba(61, 42, 28, 0.8));
        z-index: 1;
    }

    /* Estrellitas flotantes */
    .stars {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
        overflow: hidden;
    }

    .star {
        position: absolute;
        background: #d4af37;
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        animation: twinkle 3s infinite ease-in-out;
    }

    @keyframes twinkle {
        0%, 100% {
            opacity: 0.3;
            transform: scale(1);
        }
        50% {
            opacity: 1;
            transform: scale(1.2);
        }
    }

    /* Banner Superior */
    .top-banner {
        background: linear-gradient(90deg, rgba(61, 42, 28, 0.9), rgba(139, 99, 60, 0.8), rgba(61, 42, 28, 0.9));
        backdrop-filter: blur(10px);
        border-bottom: 2px solid rgba(212, 175, 55, 0.5);
        padding: 12px 20px;
        text-align: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        position: relative;
        overflow: hidden;
    }

    .top-banner::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(45deg, transparent, rgba(212, 175, 55, 0.1), transparent);
        animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
        0% {
            transform: translateX(-100%) translateY(-100%);
        }
        100% {
            transform: translateX(100%) translateY(100%);
        }
    }

    .top-banner h1 {
        font-family: 'Allura', cursive;
        font-size: 2.5em;
        color: #d4af37;
        text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        letter-spacing: 2px;
        position: relative;
        z-index: 1;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
    }

    .top-banner h1 i {
        font-size: 0.8em;
    }

    /* Botón Volver */
    .back-button {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        padding: 10px 20px;
        background: rgba(26, 20, 16, 0.8);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(212, 175, 55, 0.4);
        border-radius: 12px;
        color: #d4af37;
        font-size: 1.1em;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.3s ease;
        z-index: 10;
    }

    .back-button:hover {
        background: rgba(212, 175, 55, 0.3);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        transform: translateY(-50%) translateX(-5px);
    }

    /* Contenedor Principal */
    .main-container {
        display: flex;
        height: calc(100vh - 70px);
        padding: 20px;
        gap: 20px;
    }

    /* Sección Instagram */
    .instagram-section {
        flex: 2;
        background: linear-gradient(135deg, rgba(61, 42, 28, 0.85), rgba(26, 20, 16, 0.9));
        backdrop-filter: blur(15px);
        border: 2px solid rgba(212, 175, 55, 0.3);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    .instagram-header {
        text-align: center;
        margin-bottom: 15px;
    }

    .instagram-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 10px;
        filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.5));
    }

    .instagram-title {
        font-family: 'Allura', cursive;
        font-size: 2.5em;
        color: #d4af37;
        text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        margin-bottom: 5px;
    }

    .instagram-handle {
        font-size: 1.3em;
        color: #f4e4c1;
        margin-bottom: 10px;
    }

    .instagram-frame {
        flex: 1;
        width: 100%;
        border: none;
        border-radius: 15px;
        background: rgba(0, 0, 0, 0.3);
    }

    /* Sección QR Codes */
    .qr-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .qr-card {
        flex: 1;
        background: linear-gradient(135deg, rgba(61, 42, 28, 0.85), rgba(26, 20, 16, 0.9));
        backdrop-filter: blur(15px);
        border: 2px solid rgba(212, 175, 55, 0.3);
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        text-align: center;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    .qr-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, transparent, rgba(212, 175, 55, 0.1));
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .qr-card:hover {
        transform: translateY(-5px);
        border-color: rgba(212, 175, 55, 0.6);
        box-shadow: 0 12px 40px rgba(212, 175, 55, 0.3);
    }

    .qr-card:hover::before {
        opacity: 1;
    }

    .qr-icon {
        font-size: 3em;
        color: #d4af37;
        margin-bottom: 15px;
        text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        position: relative;
        z-index: 1;
    }

    .qr-title {
        font-family: 'Allura', cursive;
        font-size: 2em;
        color: #d4af37;
        text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        margin-bottom: 15px;
        position: relative;
        z-index: 1;
    }

    .qr-description {
        font-size: 1.1em;
        color: #f4e4c1;
        margin-bottom: 15px;
        position: relative;
        z-index: 1;
    }

    .qr-image {
        width: 180px;
        height: 180px;
        margin: 0 auto;
        border-radius: 15px;
        border: 3px solid rgba(212, 175, 55, 0.4);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        background: white;
        padding: 10px;
        position: relative;
        z-index: 1;
        transition: all 0.3s ease;
    }

    .qr-card:hover .qr-image {
        transform: scale(1.05);
        box-shadow: 0 8px 30px rgba(212, 175, 55, 0.4);
    }

    /* Animaciones */
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .instagram-section, .qr-card {
        animation: fadeIn 0.6s ease forwards;
    }

    .qr-card:nth-child(2) {
        animation-delay: 0.2s;
        opacity: 0;
    }

    .instagram-section {
        opacity: 0;
        animation-delay: 0.1s;
    }
  </style>
</head>
<body>
<!-- Fondo -->
<div class="background"></div>

<!-- Estrellitas -->
<div class="stars" id="stars"></div>

<!-- Banner Superior -->
<div class="top-banner">
  <a href="index.html" class="back-button">← Volver</a>
  <h1><i class="fab fa-instagram"></i> Síguenos en Instagram</h1>
</div>

<!-- Contenedor Principal -->
<div class="main-container">
  <!-- Sección Instagram -->
  <div class="instagram-section">
    <div class="instagram-header">

      <div class="instagram-title">Ensanbliss</div>

    </div>
    <iframe class="instagram-frame"
            src="https://www.instagram.com/ensanbliss/embed/"
            frameborder="0"
            scrolling="yes"
            allowtransparency="true"></iframe>
  </div>

  <!-- Sección QR Codes -->
  <div class="qr-section">
    <!-- QR Instagram -->
    <div class="qr-card">

      <div class="qr-title">Síguenos</div>

      <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://www.instagram.com/ensanbliss/"
           alt="QR Instagram"
           class="qr-image">
    </div>

    <!-- QR Reseñas Google -->
    <div class="qr-card">

      <div class="qr-title">Déjanos tu Reseña</div>

      <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://share.google/3a9ncQW6MYjFqyPvz"
           alt="QR Google Reviews"
           class="qr-image">
    </div>
  </div>
</div>

<script>
  // Generar estrellitas aleatorias
  function createStars() {
      const starsContainer = document.getElementById('stars');
      const numberOfStars = 30;

      for (let i = 0; i < numberOfStars; i++) {
          const star = document.createElement('div');
          star.className = 'star';

          const size = Math.random() * 6 + 3;
          star.style.width = size + 'px';
          star.style.height = size + 'px';

          star.style.left = Math.random() * 100 + '%';
          star.style.top = Math.random() * 100 + '%';

          star.style.animationDelay = `${Math.random() * 3}s`;
          star.style.opacity = Math.random() * 0.5 + 0.3;

          starsContainer.appendChild(star);
      }
  }

  createStars();
</script>


<!-- Ensanbliss Modal Alerts (Velociraptor style) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">

<style>
  :root{
    --ens-bg: rgba(10, 8, 7, 0.72);
    --ens-card: rgba(18, 14, 12, 0.92);
    --ens-stroke: rgba(255,255,255,0.14);
    --ens-text: rgba(255,255,255,0.92);
    --ens-muted: rgba(255,255,255,0.70);
    --ens-gold: rgba(210, 170, 110, 0.95);
    --ens-shadow: 0 18px 55px rgba(0,0,0,0.55);
  }

  .ens-alert-overlay{
    position: fixed;
    inset: 0;
    background: var(--ens-bg);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    z-index: 999999;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .ens-alert-overlay.show{ display: flex; }

  .ens-alert-card{
    width: min(560px, 92vw);
    border: 1px solid var(--ens-stroke);
    background: var(--ens-card);
    border-radius: 18px;
    box-shadow: var(--ens-shadow);
    overflow: hidden;
  }

  .ens-alert-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.10);
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0));
  }

  .ens-alert-brand{
    font-family: "Allura", cursive;
    font-size: 34px;
    line-height: 1;
    color: var(--ens-gold);
    letter-spacing: 0.2px;
    user-select: none;
  }

  .ens-alert-closex{
    appearance: none;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: var(--ens-text);
    border-radius: 10px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 14px;
  }
  .ens-alert-closex:hover{ background: rgba(255,255,255,0.10); }

  .ens-alert-body{
    padding: 14px 16px 6px;
    color: var(--ens-text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    white-space: pre-wrap;
  }

  .ens-alert-footer{
    padding: 12px 16px 16px;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .ens-btn{
    appearance: none;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.08);
    color: var(--ens-text);
    padding: 10px 14px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
  }
  .ens-btn:hover{ background: rgba(255,255,255,0.12); }

  .ens-btn-primary{
    border-color: rgba(210, 170, 110, 0.55);
    background: rgba(210, 170, 110, 0.16);
  }
  .ens-btn-primary:hover{ background: rgba(210, 170, 110, 0.22); }

  .ens-alert-sub{
    padding: 0 16px 6px;
    color: var(--ens-muted);
    font-size: 12.5px;
  }
</style>

<div id="ensAlert" class="ens-alert-overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="ens-alert-card">
    <div class="ens-alert-header">
      <div class="ens-alert-brand">Ensanbliss</div>
      <button class="ens-alert-closex" type="button" data-ens-close aria-label="Cerrar">Cerrar</button>
    </div>

    <div id="ensAlertMsg" class="ens-alert-body"></div>
    <div id="ensAlertSub" class="ens-alert-sub" style="display:none;"></div>

    <div id="ensAlertActions" class="ens-alert-footer"></div>
  </div>
</div>

<script>
(function(){
  const overlay = document.getElementById('ensAlert');
  const msgEl = document.getElementById('ensAlertMsg');
  const subEl = document.getElementById('ensAlertSub');
  const actionsEl = document.getElementById('ensAlertActions');

  let lastActive = null;

  function openModal({ message, subtext, buttons }) {
    lastActive = document.activeElement;

    msgEl.textContent = (message ?? '').toString();

    if (subtext) {
      subEl.style.display = 'block';
      subEl.textContent = subtext.toString();
    } else {
      subEl.style.display = 'none';
      subEl.textContent = '';
    }

    actionsEl.innerHTML = '';
    buttons.forEach(btn => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'ens-btn' + (btn.primary ? ' ens-btn-primary' : '');
      b.textContent = btn.label;
      b.addEventListener('click', () => {
        closeModal();
        try { btn.onClick && btn.onClick(); } catch(e){}
      });
      actionsEl.appendChild(b);
    });

    overlay.classList.add('show');
    overlay.setAttribute('aria-hidden', 'false');

    const firstBtn = actionsEl.querySelector('button');
    if (firstBtn) firstBtn.focus();
  }

  function closeModal(){
    overlay.classList.remove('show');
    overlay.setAttribute('aria-hidden', 'true');
    actionsEl.innerHTML = '';

    if (lastActive && typeof lastActive.focus === 'function') {
      try { lastActive.focus(); } catch(e){}
    }
  }

  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal();
  });

  overlay.querySelectorAll('[data-ens-close]').forEach(el => {
    el.addEventListener('click', closeModal);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('show')) closeModal();
  });

  window.alert = function(message){
    openModal({
      message,
      subtext: '',
      buttons: [{ label: 'Cerrar', primary: true, onClick: () => {} }]
    });
  };

  window.ensConfirm = function(message){
    return new Promise((resolve) => {
      openModal({
        message,
        subtext: '¿Deseas continuar?',
        buttons: [
          { label: 'Cancelar', primary: false, onClick: () => resolve(false) },
          { label: 'Confirmar', primary: true, onClick: () => resolve(true) }
        ]
      });
    });
  };

  window.confirm = function(message){
    openModal({
      message,
      subtext: 'Confirmación requerida',
      buttons: [{ label: 'Cerrar', primary: true, onClick: () => {} }]
    });
    return false;
  };
})();
</script>

</body>
</html>
